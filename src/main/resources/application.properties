# Conexão com o Banco de Dados (com suporte a variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crud_banco}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0509}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Configurações de Segurança e Borda
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.max-requests-per-minute=${RATE_LIMIT_MAX_RPM:60}
